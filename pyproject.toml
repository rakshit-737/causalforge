[build-system]
requires = ["setuptools>=78,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "causalforge"
version = "0.1.0"
description = "Evidence-bound incident reconstruction and reversible response for cloud-native systems."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "CausalForge contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "networkx>=3.3,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "redis>=5,<8",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-networkx>=3.3,<4",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["causalforge*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = ["services: requires explicitly configured local PostgreSQL and Redis services"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/causalforge"]
