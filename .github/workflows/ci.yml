name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run tests
        run: uv run --locked --extra dev python -m pytest

      - name: Lint
        run: uv run --locked --extra dev python -m ruff check backend scripts lab

      - name: Type-check
        run: uv run --locked --extra dev python -m mypy backend/causalforge

      - name: Compile source
        run: uv run --locked --extra dev python -m compileall -q backend scripts lab

      - name: Bandit scan
        run: uv run --locked --extra dev python -m bandit -q -r backend/causalforge scripts lab

      - name: Dependency audit
        run: uv run --locked --extra dev python -m pip_audit --local

  offline-demo:
    name: Reproducible offline demo
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --python "3.12" --extra dev

      - name: Regenerate report and require a clean tree
        run: |
          uv run --locked --extra dev python scripts/demo.py --output reports/demo.md
          git diff --exit-code -- reports/demo.md
